# =============================================================================
# Automatic site verification for jeffkurrus.com
#
# WHAT THIS DOES, IN PLAIN LANGUAGE
# GitHub runs two free robots for us.
#
#   Robot 1 (guard-headers) reads the _headers file on every push and refuses
#   the change if it contains the caching setting that broke the site in
#   September 2026. It runs in about five seconds and needs no network.
#
#   Robot 2 (verify-live) opens the real website - the same way a phone would -
#   and checks that every file the page needs actually loads. It runs four
#   minutes after each push (once Cloudflare has finished publishing), and
#   again every six hours, forever.
#
# WHEN SOMETHING BREAKS
# GitHub emails the repository owner automatically. There is nothing to sign
# up for and nothing to remember. A red X appears next to the commit on
# github.com, and the page the email's button lands on now says what is wrong
# IN PLAIN ENGLISH - see the summary block in scripts/verify-live.sh.
#
# That plain-English page was added 2026-09-04 because GitHub's own email says
# only "Some jobs were not successful." Jess received two on 2026-09-03 and
# could not tell whether anything was actually wrong. An alarm that cannot be
# read without investigating is half an alarm.
#
# COST: nothing. Roughly one hour of GitHub's 2,000 free monthly minutes.
#
# -----------------------------------------------------------------------------
# KNOWN LIMIT OF THE SIX-HOURLY SCHEDULE - read before relying on it
#
# GitHub's documentation states:
#
#   "In a public repository, scheduled workflows are automatically disabled
#    when no repository activity has occurred in 60 days."
#   - docs.github.com/en/actions/how-tos/manage-workflow-runs/
#     disable-and-enable-workflows  [VERIFIED 2026-09-04]
#
# This repository IS public [VERIFIED 2026-09-04], so the rule applies. If
# nobody pushes for 60 days, the six-hourly check switches itself off silently
# and can be turned back on from the Actions tab.
#
# WHY WE ACCEPT THIS RATHER THAN WORK AROUND IT:
#   - Any push resets the 60-day clock, and a push also runs the check.
#   - The bug class this guards against APPEARS AT DEPLOY TIME. If nothing has
#     been deployed for 60 days, nothing new can have broken this way.
#   - The obvious workaround - a scheduled job that commits a heartbeat file to
#     keep the repo "active" - would trigger a Cloudflare rebuild on every
#     heartbeat. That means pointless deploys, and a deploy is precisely the
#     risky moment. The cure would manufacture the disease.
#   - The push-triggered check, the Cloudflare deploy-failure email and the
#     boot safety net are all unaffected by this limit.
#
# Residual risk, stated plainly: during a quiet spell longer than 60 days, an
# outage caused by something OUTSIDE our deploys (a Cloudflare change, a DNS or
# domain lapse) could go unnoticed until someone looks. Run the check by hand
# any time from the Actions tab via "Run workflow", or locally with
# `bash scripts/verify-live.sh`.
# =============================================================================

name: Verify jeffkurrus.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every six hours. Times are UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: # lets Jess run it on demand from the Actions tab

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Robot 1: block the September 2026 bug from ever being re-introduced.
  # ---------------------------------------------------------------------------
  guard-headers:
    name: Guard against cache-poisoning headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject 'immutable' and long max-age in _headers
        run: |
          set -euo pipefail
          FILE="client/public/_headers"
          echo "Checking $FILE"

          # Ignore comment lines; only inspect live directives.
          LIVE="$(grep -vE '^\s*#' "$FILE" || true)"

          FAILED=0

          if printf '%s' "$LIVE" | grep -qi 'immutable'; then
            echo "::error file=$FILE::'immutable' is banned in _headers."
            echo ""
            echo "WHY: a rule in _headers applies to every response at that path,"
            echo "including the fallback HTML that Cloudflare returns when a file"
            echo "is missing. Marking that HTML 'immutable' freezes a broken copy"
            echo "in phone browsers for up to a year and it survives reloads."
            echo "That is what made the site render blank white on four phones"
            echo "in September 2026. See the comment block at the top of $FILE."
            FAILED=1
          fi

          # Every Cache-Control line must be revalidatable. A non-zero max-age
          # without must-revalidate lets a wrong answer sit unchallenged.
          while IFS= read -r line; do
            case "$line" in
              *[Cc]ache-[Cc]ontrol:*) ;;
              *) continue ;;
            esac
            if printf '%s' "$line" | grep -qi 'must-revalidate'; then continue; fi
            if printf '%s' "$line" | grep -qiE 'max-age=0([^0-9]|$)'; then continue; fi
            echo "::error file=$FILE::Cache-Control without must-revalidate: $line"
            echo "Every cache rule here must be revalidatable, so a wrong"
            echo "response expires on its own instead of sticking."
            FAILED=1
          done <<< "$LIVE"

          if [ "$FAILED" -eq 1 ]; then
            {
              echo "# A banned caching rule was added to \`_headers\`"
              echo
              echo "**This push was refused.** The rule it adds is the one that made"
              echo "jeffkurrus.com render a blank white page on four phones in"
              echo "September 2026: a broken file could get stuck in a phone for up to"
              echo "a year and survive reloads."
              echo
              echo "Open \`client/public/_headers\` and read the comment block at the top."
              echo "Never \`immutable\`; every cache rule is \`max-age=0\` or carries"
              echo "\`must-revalidate\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK - no cache-poisoning directives found."

      - name: Confirm the boot safety net is still in index.html
        run: |
          set -euo pipefail
          if grep -q 'id="boot-fallback"' client/index.html; then
            echo "OK - the boot safety net is present."
          else
            echo "::error file=client/index.html::The boot safety net (id=\"boot-fallback\") was removed."
            echo "Without it, a failed page load shows a blank white screen with"
            echo "no message and no way for a visitor to reach Jeff."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Robot 2: open the real site and prove it works.
  # ---------------------------------------------------------------------------
  verify-live:
    name: Verify the live site
    runs-on: ubuntu-latest
    # On a pull request there is nothing deployed yet, so skip it.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages to finish publishing
        if: github.event_name == 'push'
        run: |
          echo "Cloudflare Pages builds and deploys after a push."
          echo "Waiting four minutes so we test the NEW version, not the old one."
          sleep 240

      - name: Check the live site
        run: bash scripts/verify-live.sh
